[window]
dynamic_padding = true
opacity = 1.0
decorations = "none"
padding = { x = 20, y = 10 }

[scrolling]
history = 10000
multiplier = 30

[font]
size = 12

[font.normal]
family = "Intel One Mono"
style = "Regular"

[font.bold]
family = "Intel One Mono"
style = "Bold"

[font.italic]
family = "Intel One Mono"
style = "Italic"

[font.bold_italic]
family = "Intel One Mono"
style = "Bold Italic"

[mouse]
hide_when_typing = true

[general]
live_config_reload = true

[terminal]
shell = { program = "pwsh.exe", args = ["-NoLogo"] }
